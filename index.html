<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>화순전남대학교병원 길찾기</title>

<style>

body{
    font-family:'맑은 고딕',sans-serif;
    background:#f5f5f5;
    margin:0;
}

.header{
    background:#005BAC;
    color:white;
    text-align:center;
    padding:20px;
    font-size:30px;
    font-weight:bold;
}

.card{
    width:90%;
    max-width:650px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

button{

    width:100%;
    padding:18px;
    margin:10px 0;

    font-size:22px;

    border:none;
    border-radius:12px;

    background:#007BFF;
    color:white;

    cursor:pointer;

    transition:.2s;

}

button:hover{

    background:#0056b3;

    transform:scale(1.02);

}

.result{

    margin-top:25px;

    background:#eef7ff;

    padding:20px;

    border-radius:15px;

    font-size:21px;

    line-height:42px;

    text-align:center;

}

.result h2{

    color:#005BAC;

}

.result img{

    width:100%;

    max-width:700px;

    height:auto;

    display:block;

    margin:15px auto;

    border-radius:15px;

    border:2px solid #ddd;

    box-shadow:0 5px 15px rgba(0,0,0,.2);

    cursor:pointer;

    transition:0.3s;

}

.result img:hover{

    transform:scale(1.02);

}
/* 사진 확대창 */
.modal{

    display:none;

    position:fixed;

    left:0;
    top:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.85);

    justify-content:center;

    align-items:center;

    z-index:9999;

}

.modal img{

    max-width:95%;

    max-height:95%;

    border-radius:15px;

}

</style>

</head>
