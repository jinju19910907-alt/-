<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>화순전남대학교병원 길찾기</title>

<style>

body{
    font-family:'맑은 고딕',sans-serif;
    background:#f5f5f5;
    margin:0;
}

.header{
    background:#43974E;
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;

    padding:20px;

    font-size:30px;
    font-weight:bold;
}

.logo{
    width:55px;
    height:55px;

    border-radius:50%;
    background:white;
    padding:4px;

    object-fit:contain;
}

.card{
    width:90%;
    max-width:650px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

button{

    width:100%;
    padding:18px;
    margin:10px 0;

    font-size:22px;

    border:none;
    border-radius:12px;

    background:#43974E;
    color:white;

    cursor:pointer;

    transition:.2s;

}

button:hover{

    background:#357A3F;

    transform:scale(1.02);

}

.result{

    margin-top:25px;

    background:#eef7ff;

    padding:20px;

    border-radius:15px;

    font-size:21px;

    line-height:26px;

    text-align:center;

}

.result h2{

    color:#005BAC;

}

.result img{

    width:100%;

    max-width:700px;

    height:auto;

    display:block;

    margin:15px auto;

    border-radius:15px;

    border:2px solid #ddd;

    box-shadow:0 5px 15px rgba(0,0,0,.2);

    cursor:pointer;

    transition:0.3s;

}

.result img:hover{

    transform:scale(1.02);

}
/* 사진 확대창 */
.modal{

    display:none;

    position:fixed;

    left:0;
    top:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.85);

    justify-content:center;

    align-items:center;

    z-index:9999;

}

.modal img{

    max-width:95%;

    max-height:95%;

    border-radius:15px;

}

</style>

</head>

<body>

<div class="header">

    <img src="./z.png" alt="화순전남대학교병원 로고" class="logo">

    <span>화순전남대학교병원 길찾기</span>

    <img src="./m.jpg" alt="남부대학교 로고" class="logo">

</div>

<div class="card">

<h2>현재 위치</h2>

<h1>📍 52병동</h1>

<hr>

<h2>목적지를 선택하세요</h2>

<button onclick="showParking()">🚗 10주차장 (외부)</button>
<div id="parkingResult"></div>

<button onclick="showMRI()">🧲 MRI실 (1층)</button>
<div id="mriResult"></div>

<button onclick="showCT()">🩻 CT실 (1층)</button>
<div id="ctResult"></div>

<button onclick="showRT()">🎯 방사선종양학과 (1층)</button>
<div id="rtResult"></div>

<button onclick="showGI()">🩺 소화기내과 (1층)</button>
<div id="giResult"></div>

<button onclick="showEmergencyOffice()">🚑 응급실 · 💳 원무과 (1층)</button>
<div id="emergencyResult"></div>

<button onclick="showEndoscopy()">🩺 내시경실 (2층)</button>
<div id="endoscopyResult"></div>

<button onclick="showXray()">🦴 X-RAY실 (6층)</button>
<div id="xrayResult"></div>

</div>

<script>


function toggleResult(id, content){

const result = document.getElementById(id);

// 이미 열려 있으면 닫기
if(result.innerHTML !== ""){
    result.innerHTML = "";
    return;
}

// 닫혀 있으면 열기
result.innerHTML = content;

}


// ==========================
// 응급실 · 원무과
// ==========================

function showEmergencyOffice(){

toggleResult("emergencyResult",`

<div class="result">

<h2>🚑 응급실 · 💳 원무과</h2>

<img src="./a.jpg">

<br><br>⬇<br><br>

③ 안내창구에서 오른쪽으로 쭉 직진

<br><br>⬇<br><br>

④ CT실 맞은편

<br><br>⬇<br><br>

✅ 응급실 · 원무과 도착

</div>

`);

}

</script>

<div id="imageModal" class="modal" onclick="closeImage()">

    <img id="modalImg">

</div>

</body>

</html>
